<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPF Calculator - Employee Provident Fund</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">EPF Calculator</h1>
        <p class="text-center text-gray-600 mb-8">Calculate your retirement corpus and interest earned on EPF.</p>

        <div class="grid md:grid-cols-2 gap-8 bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Monthly Basic Salary + DA (₹)</label>
                    <input type="number" id="basicSalary" value="25000" class="mt-1 w-full p-3 border rounded-xl" oninput="calculateEPF()">
                </div>
                <div>
                    <label class="block text-sm font-medium">Your Current Age (Years)</label>
                    <input type="number" id="age" value="25" class="mt-1 w-full p-3 border rounded-xl" oninput="calculateEPF()">
                </div>
                <div>
                    <label class="block text-sm font-medium">Annual Increment (%)</label>
                    <input type="number" id="increment" value="5" class="mt-1 w-full p-3 border rounded-xl" oninput="calculateEPF()">
                </div>
                <div>
                    <label class="block text-sm font-medium">EPF Interest Rate (%)</label>
                    <input type="number" id="rate" value="8.25" class="mt-1 w-full p-3 border rounded-xl" oninput="calculateEPF()">
                </div>
            </div>

            <div class="bg-emerald-50 p-6 rounded-xl flex flex-col justify-between border border-emerald-100">
                <div class="space-y-3">
                    <h3 class="text-lg font-semibold text-emerald-900 mb-4">Retirement Summary (Age 58)</h3>
                    <div class="flex justify-between text-sm">
                        <span>Employee Contribution:</span>
                        <span id="empTotal" class="font-semibold">₹0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>Employer Contribution:</span>
                        <span id="emprTotal" class="font-semibold">₹0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span>Total Interest Earned:</span>
                        <span id="interestEarned" class="font-semibold text-emerald-600">₹0</span>
                    </div>
                </div>
                <div class="pt-4 border-t border-emerald-200 mt-4">
                    <span class="text-sm text-emerald-800 block">Total Corpus</span>
                    <span id="maturityAmount" class="text-3xl font-extrabold text-emerald-700">₹0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateEPF() {
            let basicSalary = Number(document.getElementById('basicSalary').value);
            let age = Number(document.getElementById('age').value);
            let increment = Number(document.getElementById('increment').value);
            let rate = Number(document.getElementById('rate').value);

            let totalBalance = 0, empContrib = 0, emprContrib = 0;
            let years = 58 - age;
            let monthlyRate = rate / 12 / 100;

            for (let i = 0; i < years; i++) {
                for (let m = 0; m < 12; m++) {
                    let empMonthly = basicSalary * 0.12;
                    let emprMonthly = basicSalary * 0.0367;
                    empContrib += empMonthly;
                    emprContrib += emprMonthly;
                    totalBalance = (totalBalance + empMonthly + emprMonthly) * (1 + monthlyRate);
                }
                basicSalary += basicSalary * (increment / 100);
            }

            document.getElementById('empTotal').innerText = '₹' + Math.round(empContrib).toLocaleString('en-IN');
            document.getElementById('emprTotal').innerText = '₹' + Math.round(emprContrib).toLocaleString('en-IN');
            document.getElementById('interestEarned').innerText = '₹' + Math.round(totalBalance - (empContrib + emprContrib)).toLocaleString('en-IN');
            document.getElementById('maturityAmount').innerText = '₹' + Math.round(totalBalance).toLocaleString('en-IN');
        }
        calculateEPF();
    </script>
</body>
</html>
